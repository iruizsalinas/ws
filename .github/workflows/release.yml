name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - name: Verify the release and install LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          test -n "$LUAROCKS_API_KEY"
          (cd dist && sha256sum --check SHA256SUMS)
          python .github/scripts/lua.py 5.4
          python .github/scripts/luarocks.py 5.4
      - name: Tag the version
        run: |
          set -- ws-[0-9]*-1.rockspec
          spec=$1
          version=${spec#ws-}
          version=${version%-1.rockspec}
          echo "SPEC=$spec" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git tag "$version" "$GITHUB_SHA"
          git push origin "refs/tags/$version"
      - name: Publish to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: .build/luarocks/bin/luarocks upload "$SPEC" "dist/ws-$VERSION-1.src.rock" --temp-key "$LUAROCKS_API_KEY"
