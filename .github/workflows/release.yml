name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
# One release at a time; a second run waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: dist
      - name: Check the API key is set
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: test -n "$LUAROCKS_API_KEY"
      # Builds third-party code, so the key is not in its environment.
      - name: Verify the release and install LuaRocks
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python .github/scripts/lua.py 5.4
          python .github/scripts/luarocks.py 5.4
      - name: Tag the version
        run: |
          set -- ws-[0-9]*-1.rockspec
          spec=$1
          version=${spec#ws-}
          version=${version%-1.rockspec}
          echo "SPEC=$spec" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git tag "v$version" "$GITHUB_SHA"
          git push origin "refs/tags/v$version"
      - name: Publish to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: .build/luarocks/bin/luarocks upload "$SPEC" "dist/ws-$VERSION-1.src.rock" --temp-key "$LUAROCKS_API_KEY"
