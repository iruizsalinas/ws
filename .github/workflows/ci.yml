name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_commit:
        type: string
        required: false
        default: ''
  # Weekly, so new advisories and toolchain changes surface without a push.
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
env:
  WS_WERROR: '1'
jobs:
  release-version:
    name: Release version tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python .github/scripts/test_release_version.py

  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: Rust 1.88 (minimum)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - name: Test
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 test --workspace --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - name: Audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny unsound --deny yanked

  fuzz:
    name: Fuzz / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [reader, handshake]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - name: Fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
          python fuzz/seeds.py
          cargo +nightly fuzz run '${{ matrix.target }}' -- -max_total_time=60
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/

  autobahn:
    name: Autobahn TestSuite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Run
        run: |
          python .github/scripts/lua.py 5.4
          .build/lua/5.4/bin/lua scripts/build.lua
          python .github/scripts/autobahn.py --lua .build/lua/5.4/bin/lua
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: autobahn
          path: .build/autobahn/

  # One module per platform serves every Lua version, so each job builds it
  # once and tests it with all of them.
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Built against glibc 2.28, so the bundles load on RHEL 8, Debian 10,
    # Ubuntu 18.10 and anything newer.
    container: ${{ matrix.arch == 'aarch64'
      && 'quay.io/pypa/manylinux_2_28_aarch64:2026.10.03-1@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514'
      || 'quay.io/pypa/manylinux_2_28_x86_64:2026.10.03-1@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          curl -sSf --retry 5 --retry-connrefused https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo /opt/python/cp313-cp313/bin >> "$GITHUB_PATH"
      - name: Build and test
        run: sh .github/scripts/bundle.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bundle-linux-${{ matrix.arch }}
          path: bundles/
          if-no-files-found: error

  bundle:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, windows-2022]
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Windows toolchain
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build and test (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf --retry 5 --retry-connrefused https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          sh .github/scripts/bundle.sh
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # UCRT64 gcc only: MSYS2's usr\bin has a link.exe that shadows MSVC's.
          $env:PATH = "$env:MSYS2_LOCATION\ucrt64\bin;" + $env:PATH
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          $env:RUSTUP_TOOLCHAIN = 'stable-x86_64-pc-windows-gnu'
          $versions = '5.1', '5.2', '5.3', '5.4', '5.5'
          $build = Join-Path (Get-Location).Path ".build"
          foreach ($v in $versions) { python .github/scripts/lua.py $v }
          & "$build\lua\5.4\bin\lua.exe" scripts/build.lua
          foreach ($v in $versions) {
            Write-Output "== Lua $v"
            & "$build\lua\$v\bin\lua.exe" tests/native/install.lua
            & "$build\lua\$v\bin\lua.exe" tests/run.lua
            python tests/native/strings.py --lua "$build\lua\$v\bin\lua.exe"
          }
          python tests/native/abi.py
          python tests/native/lifecycle.py --lua "$build\lua\5.4\bin\lua.exe"
          New-Item -ItemType Directory -Force "bundles/win32-x86_64" | Out-Null
          Move-Item ws/core.dll "bundles/win32-x86_64/core.dll"
          python .github/scripts/luarocks.py 5.4
          python .github/scripts/package.py --partial
          foreach ($v in $versions) {
            Write-Output "== Installed into Lua $v"
            python .github/scripts/install.py --lua "$build\lua\$v\bin\lua.exe" --luarocks .build/luarocks/luarocks-3.13.0-windows-64/luarocks.exe
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/
          if-no-files-found: error

  luajit:
    name: LuaJIT / ${{ matrix.os }}
    needs: [linux, bundle]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: bundle-linux-x86_64
          - os: macos-15
            bundle: bundle-macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y luajit; else brew install luajit; fi
      - name: Build from source and test
        run: |
          luajit scripts/build.lua
          luajit tests/run.lua
          python tests/native/strings.py --lua luajit
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ matrix.bundle }}
          path: bundles
      - name: Test the prebuilt module
        run: |
          cp bundles/*/core.so ws/core.so
          luajit tests/run.lua

  assemble:
    needs: [release-version, rust, msrv, audit, fuzz, autobahn, linux, bundle, luajit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: Package every bundle
        run: python .github/scripts/package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.src.rock
            dist/SHA256SUMS
          if-no-files-found: error
